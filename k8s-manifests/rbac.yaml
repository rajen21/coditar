apiVersion: v1
kind: ServiceAccount
metadata:
  name: coditar-worker
  namespace: code-exec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coditar-worker
  namespace: code-exec
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coditar-worker
  namespace: code-exec
subjects:
  - kind: ServiceAccount
    name: coditar-worker
    namespace: code-exec
roleRef:
  kind: Role
  name: coditar-worker
  apiGroup: rbac.authorization.k8s.io
